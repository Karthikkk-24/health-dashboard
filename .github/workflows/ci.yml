name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test -- --passWithNoTests
      - name: E2E (webhook fail-closed)
        run: pnpm test:e2e
      - name: Snyk dependency scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        working-directory: apps/api
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck Web
        run: pnpm exec tsc --noEmit
